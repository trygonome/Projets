<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Céleste">
  <!--
    Variante sans fond, destinée au premier plan des icônes adaptatives
    d'Android : le système y applique lui-même son masque et son arrière-plan.
  -->
  <defs>
    <radialGradient id="astre" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff2cf"/>
      <stop offset="60%" stop-color="#ffd27d"/>
      <stop offset="100%" stop-color="#e8a13c"/>
    </radialGradient>
    <linearGradient id="anneau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fd4ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6fd4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6fd4ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <ellipse cx="256" cy="256" rx="150" ry="58" fill="none" stroke="url(#anneau)"
           stroke-width="9" transform="rotate(-22 256 256)"/>

  <circle cx="256" cy="256" r="72" fill="url(#astre)"/>
  <circle cx="256" cy="256" r="72" fill="none" stroke="#fff5dd" stroke-opacity="0.4" stroke-width="2"/>

  <circle cx="378" cy="196" r="18" fill="#cfc8bd"/>
  <circle cx="371" cy="190" r="18" fill="#05070e"/>
</svg>
