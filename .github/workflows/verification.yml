name: Vérification

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: Tests et cohérence du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Aucune dépendance n'est nécessaire pour les tests : le moteur
      # d'éphémérides est vendorisé et le lanceur est celui de Node.
      - name: Tests du moteur et des données
        run: node --test tests/*.test.mjs

      - name: Cohérence du dépôt
        run: node tools/verifier.mjs
