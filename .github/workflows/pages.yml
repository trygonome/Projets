name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les suivantes attendent leur tour plutôt
# que d'annuler celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Publier sur GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Cohérence du dépôt
        run: node tools/verifier.mjs

      - uses: actions/configure-pages@v5

      # L'application est un site statique : le dossier `app/` est publié tel
      # quel, sans étape de compilation.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deploiement
        uses: actions/deploy-pages@v4
