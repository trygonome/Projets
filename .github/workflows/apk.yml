name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  construire:
    name: Construire l’APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Tests du moteur et des données
        run: node --test tests/*.test.mjs

      # La signature de publication n'est disponible que si le dépôt porte les
      # secrets correspondants ; sinon, Gradle produit un APK signé avec la clé
      # de débogage, parfaitement installable pour un usage personnel.
      - name: Restaurer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/celeste-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=celeste-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Construction
        run: node tools/build-apk.mjs release

      # Sans secrets, l'APK est signé avec la clé de débogage : installable,
      # mais impossible à poser par-dessus une version signée autrement. Le nom
      # de l'artefact le dit, pour qu'on ne s'y trompe pas au téléchargement.
      - name: Décrire l’artefact
        id: nom
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signature=signe" >> "$GITHUB_OUTPUT"
          else
            echo "signature=cle-de-debogage" >> "$GITHUB_OUTPUT"
          fi
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep "certificate DN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: celeste-${{ steps.nom.outputs.version }}-${{ steps.nom.outputs.signature }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Sur une publication, l'APK est joint à la version pour être téléchargé
      # directement depuis le téléphone.
      - name: Joindre à la publication
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
